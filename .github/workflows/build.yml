name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Construire l'APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk MusicDownloader.apk

      # Sur une pull request, l'APK de test est disponible dans l'onglet "Actions"
      - name: Garder l'APK de test
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: MusicDownloader-apk
          path: MusicDownloader.apk

      # Publie l'APK dans l'onglet "Releases" du dépôt : téléchargeable directement depuis le téléphone
      - name: Publier la release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MusicDownloader build ${{ github.run_number }}
          files: MusicDownloader.apk
          make_latest: true
